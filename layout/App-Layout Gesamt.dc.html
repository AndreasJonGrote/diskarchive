<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="ds-disk-archive.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script src="fade-fit.js"></script>
  <style>
    .measure-root[data-all] *:not([data-measure-overlay]):not([data-measure-overlay] *) { outline:1px solid rgb(0 140 255 / .18); outline-offset:-1px; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .spin-ic { display: inline-block; animation: spin 1.8s linear infinite; }
    .ph-duotone.duo80 { --ph-duotone-opacity: .95; }
    .ph-duotone.duo80:after { opacity: .95 !important; }
    .ph-duotone.duo100 { --ph-duotone-opacity: 1; }
    .ph-duotone.duo100:after { opacity: 1 !important; }
    .ic { display: inline-block; vertical-align: middle; flex: none; }
    .finder-hover-row .finder-hover { opacity: 0; transition: opacity .12s ease; }
    .finder-hover-row:hover .finder-hover { opacity: 1; }
    .eject-swap { display:inline-flex; }
    #s04 .card { transition:box-shadow .18s ease, border-color .18s ease; }
    #s04 .card:hover { box-shadow:0 2px 6px rgb(0 0 0 / .08), 0 6px 16px rgb(0 0 0 / .07); }
    #s04 .card:not([style*="#E04830"]):not([style*="0.70 0.17 35"]) { border-color:oklch(0.62 0 0) !important; }
    #s04 .card:hover:not([style*="#E04830"]):not([style*="0.70 0.17 35"]) { border-color:#1f1f1f !important; }
    #s04 [data-screen-label="Dark Mode"] .card:hover:not([style*="#E04830"]):not([style*="0.70 0.17 35"]) { border-color:var(--color-text) !important; }
    .eject-side { width:0 !important; min-width:0 !important; margin-left:-6px; opacity:0; overflow:hidden; border-width:0 !important; transition:width .18s ease, margin-left .18s ease, opacity .14s ease, background-color .12s ease, color .12s ease; }
    .card:hover .eject-side { width:calc(1lh + 8px) !important; margin-left:0; opacity:1; border-width:1px !important; }
    @media (prefers-reduced-motion: reduce) { .eject-side { transition:none; } }
    .eject-swap > .eject-btn { display:none; }
    .card:hover .eject-swap > .tag:not(.eject-btn) { display:none !important; }
    .card:hover .eject-swap > .eject-btn { display:inline-flex; }
    .eject-cell > .eject-ov { display:none; }
    .eject-swap { align-items:center; }
    .eject-ov { inset:auto !important; left:-4px !important; top:50% !important; transform:translateY(-50%); }
    tr:hover .eject-cell > .tag:not(.eject-ov) { visibility:hidden; }
    tr:hover .eject-cell > .eject-ov { display:inline-flex; }
    button, .btn, .finder-hover-row, .finder-hover, a[href], summary, [role="button"] { cursor: pointer; }
    .reg-table tbody tr:last-of-type td { border-bottom: none; }
  
    :root{--teal:#00A5A8;--teal-inv:#00D3D5;--fav:oklch(0.62 0.16 305);--fav-inv:oklch(0.72 0.14 305);--sel-fg:#fff}
    .dm{--teal:#00D3D5;--teal-inv:#00A5A8;--fav:oklch(0.72 0.14 305);--fav-inv:oklch(0.62 0.16 305)}
    .sel{--teal:var(--teal-inv);--fav:var(--fav-inv)}
    .dm .sel{--sel-fg:var(--color-bg);color:var(--color-bg) !important}
</style>
</helmet>

<div style="background:var(--color-bg); min-height:100vh;">

  <div class="nav" style="padding:var(--space-4) var(--space-8);">
    <div class="nav-brand" style="letter-spacing:-0.02em;">DISK ARCHIVE</div>
    <div style="font-size:13px; color:color-mix(in srgb, var(--color-text) 60%, transparent); margin-right:auto;">Index für externe Speichermedien &amp; Dateisuche — Design-Spezifikation</div>
  </div>

  <nav data-da-nav="1" style="position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--color-bg) 92%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--color-divider);">
    <div style="max-width:1400px; margin:0 auto; padding:10px var(--space-8); box-sizing:border-box; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
      <sc-for list="{{ navItems }}" as="it" hint-placeholder-count="21">
        <a href="{{ it.href }}" onClick="{{ it.go }}" class="tag tag-outline" style="text-decoration:none; display:inline-flex; gap:6px; padding:4px 10px; background:{{ it.bg }}; color:{{ it.fg }}; border-color:{{ it.bd }};"><span style="opacity:.55;">{{ it.num }}</span>{{ it.label }}</a>
      </sc-for>
    </div>
  </nav>
  <div style="padding-top:var(--space-4);">
    <dc-import name="App-Layout 00-03 Konzept und Dialoge" hint-size="100%,1600px"></dc-import>
    <dc-import name="App-Layout 04-06 Medien und Einstellungen" hint-size="100%,1600px"></dc-import>
    <dc-import name="App-Layout 07 Spaltenansicht" hint-size="100%,1600px"></dc-import>
    <dc-import name="App-Layout 08-09 Filter" hint-size="100%,1600px"></dc-import>
    <dc-import name="App-Layout 10-17 Suche und Dialoge" hint-size="100%,1600px"></dc-import>
    <dc-import name="App-Layout 18 Mitteilungen" hint-size="100%,1600px"></dc-import>
    <dc-import name="App-Layout 19 Styleguide" hint-size="100%,1600px"></dc-import>
    <dc-import name="App-Layout 20 Texte" hint-size="100%,1600px"></dc-import>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { active: 's00' };
  items = [['00','Konzept'],['01','Menüleiste'],['02','Erkennung'],['03','Dropdown'],['04','Übersicht'],['05','Einstellungen'],['06','Medium-Details'],['07','Spaltenansicht'],['08','Filter'],['09','Filter-Auswahl'],['10','Suche'],['11','Favoriten'],['12','Kontextmenü'],['13','Update'],['14','Indizierungsfehler'],['15','Absturzbericht'],['16','Unerwarteter Fehler'],['17','Über Disk Archive'],['18','Mitteilungen'],['19','Styleguide'],['20','Texte']];
  navH() { const n = document.querySelector('[data-da-nav]'); return n ? n.getBoundingClientRect().height : 0; }
  onScroll = () => {
    const off = this.navH() + 24; let cur = 's00';
    for (const [n] of this.items) { const el = document.getElementById('s' + n); if (el && el.getBoundingClientRect().top - off <= 0) cur = 's' + n; }
    if (cur !== this.state.active) this.setState({ active: cur });
  };
  go = (id) => (e) => {
    e.preventDefault();
    const el = document.getElementById(id); if (!el) return;
    const y = el.getBoundingClientRect().top + window.scrollY - this.navH() - 16;
    window.scrollTo({ top: y, behavior: 'smooth' });
    history.replaceState(null, '', '#' + id);
  };
  componentDidMount() {
    window.addEventListener('scroll', this.onScroll, { passive: true });
    const h = location.hash.slice(1);
    if (h) { let n = 0; const iv = setInterval(() => { const el = document.getElementById(h); if (el || ++n > 40) { clearInterval(iv); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - this.navH() - 16 }); } }, 150); }
    this.onScroll();
  }
  componentWillUnmount() { window.removeEventListener('scroll', this.onScroll); }
  renderVals() {
    const a = this.state.active;
    return { navItems: this.items.map(([n, l]) => { const id = 's' + n, on = id === a; return { num: n, label: l, href: '#' + id, go: this.go(id), bg: on ? 'var(--color-text)' : 'transparent', fg: on ? 'var(--color-bg)' : 'var(--color-text)', bd: on ? 'var(--color-text)' : 'var(--color-divider)' }; }) };
  }
}
</script>
</body>
</html>
